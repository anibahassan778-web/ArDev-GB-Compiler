name: Build Game Boy Standalone APK

on:
  workflow_dispatch:
    inputs:
      game_title:
        description: 'Title of the Game Boy cartridge'
        required: false
        default: 'POKEMON YELLOW'
      package_name:
        description: 'Target Android package identifier'
        required: false
        default: 'com.ardev.gb.pokemonyellow'
      rom_base64:
        description: 'Base64-encoded Game Boy ROM'
        required: false
        default: ''
  repository_dispatch:
    types: [build_gb_apk]
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Compile Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Configure Game Cartridge Assets
        run: |
          mkdir -p app/src/main/assets
          if [ -n "${{ inputs.rom_base64 }}" ]; then
            echo "${{ inputs.rom_base64 }}" | base64 -d > app/src/main/assets/game.gb
          fi
          if [ ! -f "app/src/main/assets/game.gb" ] && [ ! -f "app/src/main/assets/game.gbc" ]; then
            FOUND_ROM=$(find . -maxdepth 3 -name "*.gb" -o -name "*.gbc" | head -n 1)
            if [ -n "$FOUND_ROM" ]; then
              cp "$FOUND_ROM" app/src/main/assets/game.gb
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Assemble Release APK
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleRelease --stacktrace --no-daemon
          elif [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "Neither gradle nor gradlew found"
            exit 1
          fi

      - name: Verify, Audit & Sign Release APK
        run: |
          mkdir -p build_output
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file generated by Gradle build pipeline."
            exit 1
          fi
          echo "Found compiled APK at: $APK_PATH"
          cp "$APK_PATH" build_output/gameboy_release.apk
          sha256sum build_output/gameboy_release.apk > build_output/gameboy_release.apk.sha256
          echo "=== APK STRUCTURE AND BYTECODE AUDIT ==="
          unzip -l build_output/gameboy_release.apk | grep -E "classes\.dex|AndroidManifest\.xml|lib/|assets/"
          echo "=== SHA-256 CHECKSUM ==="
          cat build_output/gameboy_release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-standalone-apk
          path: build_output/gameboy_release.apk
          retention-days: 7
          if-no-files-found: error
