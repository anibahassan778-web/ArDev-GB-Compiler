name: Build Game Boy Standalone APK
on:
  workflow_dispatch:
    inputs:
      game_title:
        description: 'Title of the Game Boy cartridge'
        required: false
        default: 'POKEMON YELLOW'
      package_name:
        description: 'Target Android package identifier'
        required: false
        default: 'com.ardev.gb.pokemon_yellow'
      rom_base64:
        description: 'Base64-encoded Game Boy ROM'
        required: false
        default: ''
  repository_dispatch:
    types: [build_gb_apk]
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Compile Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653 cmake;3.22.1'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Game Cartridge Assets
        run: |
          mkdir -p app/src/main/assets
          if [ -n "${{ inputs.rom_base64 }}" ]; then
            echo "${{ inputs.rom_base64 }}" | base64 -d > app/src/main/assets/game.gb
          fi

      - name: Assemble Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Verify, Audit & Sign Release APK
        run: |
          mkdir -p build_output
          APK_PATH=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file generated by Gradle build pipeline."
            exit 1
          fi
          echo "Found compiled APK at: $APK_PATH"
          cp "$APK_PATH" build_output/gameboy_release.apk
          sha256sum build_output/gameboy_release.apk > build_output/gameboy_release.apk.sha256
          unzip -l build_output/gameboy_release.apk | grep -E "classes\.dex|AndroidManifest\.xml"
          cat build_output/gameboy_release.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameboy-standalone-apk
          path: build_output/gameboy_release.apk
          retention-days: 7
          if-no-files-found: error
